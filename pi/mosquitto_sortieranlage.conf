# Mosquitto-Zusatzkonfiguration Sortieranlage (VORSCHLAG, nur im geschlossenen TP-Link-Anlagennetz)
# Ziel: /etc/mosquitto/conf.d/sortieranlage.conf  (wird von pi_setup.sh --installieren kopiert)
# Mosquitto 2.x lauscht ohne "listener" nur auf localhost -> Peakboard Box käme nicht dran.
# Wird NUR benutzt, wenn Mosquitto noch gar keine eigene Einstellung hat. Stand 16.10.2026: Prof. Kampker hat
# Mosquitto mit Benutzer/Passwort eingerichtet -> diese Datei wird dann nicht verwendet (pi_installieren.sh).
# "persistence" steht bereits in der Debian-Hauptkonfiguration und darf hier nicht doppelt stehen.
listener 1883 0.0.0.0
allow_anonymous true
